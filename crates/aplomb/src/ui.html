<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplomb Watch — vue technique</title>
<style>
  :root { --fond:#f7f7f5; --carte:#fff; --texte:#1d1d1b; --doux:#6b6b66; --ligne:#e4e4df;
          --allow:#1f7a4d; --review:#a46a00; --deny:#b3261e; --gel:#6b1d7a; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#151514; --carte:#1f1f1d; --texte:#ececE8; --doux:#9a9a93; --ligne:#33332f;
            --allow:#5cc28f; --review:#e0a53a; --deny:#f07167; --gel:#c38bd1; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--fond); color:var(--texte); }
  header { padding:16px 20px; border-bottom:1px solid var(--ligne); display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  h1 { font-size:16px; margin:0; }
  .doux { color:var(--doux); }
  .compteurs { display:flex; gap:12px; margin-left:auto; }
  .compteur { background:var(--carte); border:1px solid var(--ligne); border-radius:8px; padding:6px 12px; text-align:center; min-width:70px; }
  .compteur b { display:block; font-size:18px; }
  main { padding:16px 20px; }
  .barre { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  input, button, select { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--ligne); background:var(--carte); color:var(--texte); }
  button { cursor:pointer; }
  button.danger { border-color:var(--deny); color:var(--deny); }
  table { width:100%; border-collapse:collapse; background:var(--carte); border:1px solid var(--ligne); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--ligne); vertical-align:top; }
  th { font-weight:600; color:var(--doux); font-size:12px; }
  td.res { font-family:ui-monospace, monospace; font-size:12px; word-break:break-all; max-width:420px; }
  .v { font-weight:600; text-transform:uppercase; font-size:12px; }
  .allow { color:var(--allow); } .review { color:var(--review); } .deny { color:var(--deny); } .gel { color:var(--gel); }
  .bandeau { display:none; padding:8px 20px; background:var(--gel); color:#fff; font-weight:600; }
  .revues { margin-bottom:12px; }
  .revue { background:var(--carte); border:2px solid var(--review); border-radius:8px; padding:10px 12px; margin-bottom:8px;
           display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .revue .quoi { flex:1 1 320px; min-width:0; }
  .revue .res { font-family:ui-monospace, monospace; font-size:12px; word-break:break-all; }
  button.ok { border-color:var(--allow); color:var(--allow); }
  .onglets { display:flex; gap:4px; margin-bottom:12px; }
  .onglets button[aria-selected="true"] { border-color:var(--texte); font-weight:600; }
  .tour { background:var(--carte); border:1px solid var(--ligne); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .tour h3 { font-size:13px; margin:0 0 6px; display:flex; flex-wrap:wrap; gap:10px; }
  .tour ul { margin:4px 0 0; padding-left:18px; }
  .tour li { margin:2px 0; }
  .id { font-family:ui-monospace, monospace; font-size:12px; color:var(--doux); }
  .ecart { color:var(--deny); font-weight:600; }
  .ecarts { border-color:var(--deny); }
  @media (max-width:700px) { .compteurs { margin-left:0; } td.res { max-width:160px; } }
</style>
</head>
<body>
<div class="bandeau" id="bandeau">GEL GLOBAL ACTIF — toutes les actions sont refusées</div>
<header>
  <div>
    <h1>Aplomb Watch — vue technique</h1>
    <div class="doux" id="mandat">chargement…</div>
  </div>
  <div class="compteurs">
    <div class="compteur"><b class="allow" id="c-allow">0</b>allow</div>
    <div class="compteur"><b class="review" id="c-review">0</b>review</div>
    <div class="compteur"><b class="deny" id="c-deny">0</b>deny</div>
    <div class="compteur"><b class="gel" id="c-gel">0</b>gel</div>
  </div>
</header>
<main>
  <div class="barre">
    <span class="doux" id="compte">non connecté</span>
    <button class="danger" id="geler">Geler tout</button>
    <button id="degeler" title="Deux comptes distincts sont nécessaires">Dégeler (4 yeux)</button>
    <button id="verifier">Vérifier le journal</button>
    <button id="quitter">Se déconnecter</button>
    <span class="doux" id="info"></span>
  </div>
  <section class="revues" id="revues" aria-live="polite"></section>
  <div class="onglets" role="tablist">
    <button role="tab" id="o-flux" aria-selected="true">Flux en direct</button>
    <button role="tab" id="o-chaine" aria-selected="false">Vue chaînée</button>
  </div>
  <section id="v-chaine" hidden>
    <div class="barre">
      <select id="sessions"></select>
      <button id="recharger">Actualiser</button>
      <span class="doux" id="resume"></span>
    </div>
    <div id="chaine"></div>
  </section>
  <table id="v-flux">
    <thead><tr><th>Heure</th><th>Session</th><th>Outil</th><th>Verdict</th><th>Ressource</th><th>Règle / motif</th></tr></thead>
    <tbody id="lignes"></tbody>
  </table>
</main>
<script>
const $ = (id) => document.getElementById(id);
const lignes = $("lignes");

function texte(t) { const s = document.createElement("span"); s.textContent = t; return s; }

function ajouter(evt) {
  const d = evt.detail || {};
  const tr = document.createElement("tr");
  const heure = new Date(evt.horodatage).toLocaleTimeString("fr-FR");
  const verdict = evt.type === "decision" ? d.verdict : d.revue ? "revue " + d.revue : evt.type;
  const cellules = [
    heure,
    (evt.session || "—").slice(0, 8),
    d.outil || d.action || "—",
    null,
    d.ressource || "",
    evt.type === "decision" ? `${d.regle} — ${d.motif}`
      : d.revue ? (d.par ? `par ${d.par}` : "sans réponse dans le délai")
      : [d.compte || (d.demandeur ? `${d.demandeur} + ${d.approbateur}` : ""), d.session ? `session ${d.session}` : "global"].filter(Boolean).join(" · "),
  ];
  cellules.forEach((c, i) => {
    const td = document.createElement("td");
    if (i === 3) { td.className = "v " + verdict; td.textContent = verdict; }
    else { td.appendChild(texte(c)); }
    if (i === 4) td.className = "res";
    tr.appendChild(td);
  });
  lignes.prepend(tr);
  while (lignes.children.length > 500) lignes.lastChild.remove();
}

async function rafraichir() {
  const r = await fetch("/admin/etat");
  if (r.status === 401) { nonConnecte(); return false; }
  const e = await r.json();
  $("compte").textContent = `connecté : ${e.compte} (${e.roles.join(", ")})`;
  $("mandat").textContent = `Mandat ${e.mandat.id} v${e.mandat.version} · profil ${e.mandat.profil} · ${e.mandat.racine}`;
  for (const k of ["allow", "review", "deny", "gel"]) $("c-" + k).textContent = e.compteurs[k];
  $("bandeau").style.display = e.gel_global ? "block" : "none";
  const gelees = e.sessions_gelees.length ? `${e.sessions_gelees.length} session(s) gelée(s)` : "";
  const attente = e.degels_en_attente.map(d => `dégel ${d.session ? "de " + d.session.slice(0, 8) : "global"} demandé par ${d.demandeur}`);
  $("info").textContent = [gelees, ...attente].filter(Boolean).join(" · ");
  return true;
}

function nonConnecte() {
  $("compte").textContent = "non connecté";
  $("mandat").textContent = "Connexion : aplomb admin connexion --compte <id>, puis ouvrir le lien affiché.";
  for (const id of ["geler", "degeler", "verifier", "quitter"]) $(id).disabled = true;
}

const ISSUES = { "gel": "gel appliqué", "degel-en-attente": "dégel demandé : un second compte doit approuver", "degel": "dégel appliqué (quatre yeux)" };

async function admin(chemin) {
  const r = await fetch(chemin, { method: "POST", headers: { "X-Aplomb": "1", "Content-Type": "application/json" }, body: "{}" });
  const v = await r.json().catch(() => ({}));
  await rafraichir();
  $("info").textContent = r.ok ? (ISSUES[v.issue] || "ok") : `refusé : ${v.erreur || r.status}`;
}

$("geler").onclick = () => admin("/admin/gel");
$("degeler").onclick = () => admin("/admin/degel");
$("quitter").onclick = async () => {
  await fetch("/admin/deconnexion", { method: "POST" });
  location.reload();
};
$("verifier").onclick = async () => {
  const v = await (await fetch("/admin/verify")).json();
  $("info").textContent = v.intact ? `journal intact : ${v.sessions} session(s), ${v.entrees} entrées` : `JOURNAL ROMPU : ${v.fichier} — ${v.erreur}`;
};

// --- Revues en attente : les passerelles attendent une réponse humaine ---
async function chargerRevues() {
  const r = await fetch("/admin/revues");
  if (!r.ok) return;
  const zone = $("revues");
  zone.replaceChildren();
  for (const v of await r.json()) {
    const carte = el("div", "revue");
    const quoi = el("div", "quoi");
    const reste = Math.max(0, Math.round((v.horodatage + v.delai * 1000 - Date.now()) / 1000));
    quoi.append(el("b", "review", "Revue demandée "), el("span", "doux", `${v.mode} · ${v.outil} · session ${(v.session || "").slice(0, 8)} · ${reste} s pour répondre`),
      el("div", "res", v.resume), el("div", "doux", v.motif));
    const oui = el("button", "ok", "Approuver"), non = el("button", "danger", "Refuser");
    const repondre = async (approuver) => {
      oui.disabled = non.disabled = true;
      const x = await fetch("/admin/revue", { method: "POST", headers: { "X-Aplomb": "1", "Content-Type": "application/json" },
        body: JSON.stringify({ id: v.id, approuver }) });
      const j = await x.json().catch(() => ({}));
      $("info").textContent = x.ok ? `revue ${j.issue}` : `refusé : ${j.erreur || x.status}`;
      chargerRevues();
    };
    oui.onclick = () => repondre(true);
    non.onclick = () => repondre(false);
    carte.append(quoi, oui, non);
    zone.appendChild(carte);
  }
}

// --- Vue chaînée : appel au modèle → outils demandés → décisions → réseau ---
function el(balise, classe, contenu) {
  const e = document.createElement(balise);
  if (classe) e.className = classe;
  if (contenu !== undefined) e.textContent = contenu;
  return e;
}
const court = (id) => id ? "…" + id.slice(-8) : "sans id";
const heure = (t) => t ? new Date(t).toLocaleTimeString("fr-FR") : "—";

function onglet(nom) {
  $("o-flux").setAttribute("aria-selected", nom === "flux");
  $("o-chaine").setAttribute("aria-selected", nom === "chaine");
  $("v-flux").hidden = nom !== "flux";
  $("v-chaine").hidden = nom !== "chaine";
  if (nom === "chaine" && !$("sessions").options.length) chargerSessions();
}

async function chargerSessions() {
  const liste = await (await fetch("/admin/sessions")).json();
  const sel = $("sessions");
  sel.replaceChildren();
  for (const s of liste) {
    const o = el("option", "", `${heure(s.debut)} · ${s.session.slice(0, 8)} · ${s.mode || "?"} · ${s.decisions} décision(s)`);
    o.value = s.session;
    sel.appendChild(o);
  }
  if (liste.length) chargerChaine(); else $("chaine").replaceChildren(el("p", "doux", "Aucune session d'agent au journal."));
}

function ligneAction(a) {
  const li = el("li");
  li.append(el("span", "v " + a.verdict, a.verdict), " ", `${heure(a.horodatage)} ${a.outil}`,
    " ", el("span", "id", court(a.appel)), " · ", el("span", "doux", a.regle),
    a.execute ? " · exécutée" : "",
    a.sous_agent ? ` · sous-agent ${a.sous_agent}` : "",
    a.provenance.length ? el("span", "review", ` · influencée (${a.provenance.join(", ")})`) : "");
  return li;
}

async function chargerChaine() {
  const id = $("sessions").value;
  const r = await fetch("/admin/chaine?session=" + encodeURIComponent(id));
  const c = await r.json();
  const zone = $("chaine");
  zone.replaceChildren();
  if (!r.ok) { zone.appendChild(el("p", "ecart", c.erreur || r.status)); return; }
  $("resume").textContent = `mode ${c.mode || "?"} · niveau ${c.niveau ?? "?"} · rattachement ${c.rattachement} · ${c.tours.length} appel(s) au modèle`;
  if (c.ecarts.length) {
    const b = el("div", "tour ecarts");
    b.appendChild(el("h3", "ecart", `${c.ecarts.length} écart(s) au contrôle croisé`));
    const ul = el("ul"); c.ecarts.forEach(e => ul.appendChild(el("li", "", e))); b.appendChild(ul);
    zone.appendChild(b);
  }
  for (const t of c.tours) {
    const e = t.echange, b = el("div", "tour"), h = el("h3");
    h.append(el("span", "", `Échange ${e.numero}`), el("span", "doux", `${heure(e.debut)} · ${e.modele || "modèle ?"}`),
      el("span", e.refus ? "ecart" : "doux", e.refus ? `refusé : ${e.refus}` : `statut ${e.statut ?? "—"}`),
      el("span", "doux", `jetons ${e.jetons_entree ?? "—"} → ${e.jetons_sortie ?? "—"}`));
    b.appendChild(h);
    const ul = el("ul");
    if (!e.outils.length) ul.appendChild(el("li", "doux", "aucun outil demandé"));
    for (const o of e.outils) {
      const li = el("li");
      li.append("demande ", el("b", "", o.nom), " ", el("span", "id", court(o.id)));
      const lie = t.actions.filter(a => a.appel === o.id);
      if (lie.length) { const sous = el("ul"); lie.forEach(a => sous.appendChild(ligneAction(a))); li.appendChild(sous); }
      else if (t.non_presentes.some(n => n.id === o.id)) li.append(" ", el("span", "ecart", "jamais présenté au superviseur"));
      ul.appendChild(li);
    }
    for (const n of t.reseau) {
      const li = el("li");
      li.append("réseau ", el("span", "v " + n.verdict, n.verdict), ` ${heure(n.horodatage)} · `, el("span", "doux", n.regle));
      ul.appendChild(li);
    }
    b.appendChild(ul);
    zone.appendChild(b);
  }
  if (c.hors_demande.length) {
    const b = el("div", "tour ecarts");
    b.appendChild(el("h3", "ecart", "Actions sans demande du modèle"));
    const ul = el("ul"); c.hors_demande.forEach(a => ul.appendChild(ligneAction(a))); b.appendChild(ul);
    zone.appendChild(b);
  }
}

$("o-flux").onclick = () => onglet("flux");
$("o-chaine").onclick = () => onglet("chaine");
$("sessions").onchange = chargerChaine;
$("recharger").onclick = chargerSessions;

(async () => {
  if (!(await rafraichir())) return;
  const estRevue = (evt) => evt.type === "revue" || evt.type === "revue-close";
  for (const evt of await (await fetch("/admin/historique")).json()) if (!estRevue(evt)) ajouter(evt);
  chargerRevues();
  const flux = new EventSource("/admin/events");
  flux.onmessage = (m) => {
    const evt = JSON.parse(m.data);
    if (estRevue(evt)) chargerRevues(); else ajouter(evt);
    rafraichir();
  };
})();
</script>
</body>
</html>
