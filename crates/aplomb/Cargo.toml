[package]
name = "aplomb"
version.workspace = true
edition.workspace = true
license = "EUPL-1.2"
publish.workspace = true
description = "Binaire Aplomb : service réseau (API décision / administration), hook Claude Code, outils de signature et de vérification."

[dependencies]
aplomb-core = { path = "../aplomb-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "io-util", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.2"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"
